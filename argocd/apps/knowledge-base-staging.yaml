apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-base-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakobkolb/knowledge-base
    targetRevision: main
    path: chart
    helm:
      parameters:
        - name: global.clusterIssuer
          value: letsencrypt
        - name: global.createSecrets
          value: "false"
      values: |
        global:
          baseDomain: mcp-staging.jakobjkolb.xyz
          authServerUrl: https://auth.mcp-staging.jakobjkolb.xyz
        mcp-calendar:
          configFile:
            enabled: false
          extraVolumeMounts:
            - name: calendar-config
              mountPath: /config
              readOnly: true
          extraVolumes:
            - name: calendar-config
              secret:
                secretName: knowledge-base-staging-mcp-calendar-config
        api-gateway:
          dex:
            env:
              DEX_REDIRECT_URI: https://auth.mcp-staging.jakobjkolb.xyz/callback
            config:
              issuer: https://auth.mcp-staging.jakobjkolb.xyz
          oauth2-proxy:
            extraArgs:
              oidc-issuer-url: https://auth.mcp-staging.jakobjkolb.xyz
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
