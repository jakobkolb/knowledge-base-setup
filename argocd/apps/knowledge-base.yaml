apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jakobkolb/knowledge-base
    targetRevision: prod
    path: chart
    helm:
      parameters:
        - name: global.clusterIssuer
          value: letsencrypt
        - name: global.createSecrets
          value: "false"
      values: |
        mcp-calendar:
          configFile:
            enabled: false
          extraVolumeMounts:
            - name: calendar-config
              mountPath: /config
              readOnly: true
          extraVolumes:
            - name: calendar-config
              secret:
                secretName: knowledge-base-mcp-calendar-config
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
